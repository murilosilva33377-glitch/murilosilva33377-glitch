name: GitHub Stats

on:
  schedule:
    - cron: "0 */24 * * *" # Atualiza 1 vez por dia
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Stats SVG
        uses: readme-tools/github-readme-stats-action@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          THEME: dracula
          SHOW_ICONS: true
          INCLUDE_ALL_COMMITS: true
          COUNT_PRIVATE: true
          PATH: dist/stats.svg

      - name: Generate Top Languages SVG
        uses: readme-tools/github-readme-stats-action@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          CARD: top-langs
          LAYOUT: compact
          LANGS_COUNT: 5
          THEME: dracula
          PATH: dist/languages.svg

      - name: Push Stats to branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: stats-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
