name: Generate Bomberman Contribution Graph

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Bomberman Contribution Graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: murilosilva33377-glitch
          game: bomberman
          outputs: |
            dist/bomberman-contribution-graph.svg?gameTheme=github
            dist/bomberman-contribution-graph-dark.svg?gameTheme=github-dark

      - name: Push to pacman-output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
